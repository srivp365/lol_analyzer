server {
    listen 80;
    server_name lol-analyzer.sriv.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name lol-analyzer.sriv.me;
    ssl_certificate /etc/letsencrypt/live/lol-analyzer.sriv.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lol-analyzer.sriv.me/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        set $backend_upstream http://league-coach-backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
